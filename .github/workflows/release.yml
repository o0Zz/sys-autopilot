name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219
    permissions:
      contents: write
    steps:
      # The devkitpro image is minimal; zip is needed for the release asset.
      - name: Install zip
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zip

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Build Sysmodule
        run: make dist APP_VERSION="$GITHUB_REF_NAME"

      - name: Create Release Zip
        run: |
          # Zip of the SD card layout: extract at the root of the SD card.
          (cd dist && zip -r "../sys-autopilot-$GITHUB_REF_NAME.zip" .)
          unzip -l "sys-autopilot-$GITHUB_REF_NAME.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: sys-autopilot-${{ github.ref_name }}.zip
